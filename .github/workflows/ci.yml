name: CI

on:
  push:
  pull_request:
    branches: [ main, master]

jobs:
  test:
    runs-on: ubuntu-latest  # Обов'язково вказуємо середовище для виконання
    
    steps:  # Усі кроки обов'язково мають бути під цим ключем
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          # Якщо у вас є requirements.txt, додайте: pip install -r requirements.txt

      - name: Run pytest
        run: |
          pytest -v -s